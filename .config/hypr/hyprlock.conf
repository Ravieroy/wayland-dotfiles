source = ~/.config/hypr/themes/catppuccin/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# =========================
# GENERAL
# =========================

general {
    hide_cursor = true
    grace = 1
    disable_loading_bar = true
}

# =========================
# BACKGROUND
# =========================

background {
    monitor =
    path = $HOME/.config/hypr/wallpapers/fedora-magenta-blue.png

    color = $base

    blur_passes = 2
    blur_size = 7

    brightness = 0.6
    contrast = 1.05
    vibrancy = 0.20
    vibrancy_darkness = 0.20
}

# =========================
# TOP LEFT: SYSTEM INFO
# =========================

label {
    monitor =
    text = 󰌾  $LAYOUT
    color = $subtext1
    font_size = 16
    font_family = $font

    position = 32, -28
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$USER@$(hostname)"
    color = $overlay2
    font_size = 15
    font_family = $font

    position = 32, -58
    halign = left
    valign = top
}

# =========================
# TIME AND DATE
# =========================

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font

    position = -40, -32
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtext1
    font_size = 24
    font_family = $font

    position = -45, -145
    halign = right
    valign = top
}

# =========================
# CENTER CARD: AVATAR
# =========================

image {
    monitor =
    path = $HOME/.face
    size = 110
    border_size = 3
    border_color = $accent
    rounding = -1

    position = 0, 105
    halign = center
    valign = center
}

# =========================
# CENTER CARD: GREETING
# =========================

label {
    monitor =
    text = Enter password to unlock
    color = $overlay2
    font_size = 14
    font_family = $font

    position = 0, -12
    halign = center
    valign = center
}

# =========================
# INPUT FIELD
# =========================

input-field {
    monitor =
    size = 340, 58

    outline_thickness = 3
    rounding = 18

    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true

    outer_color = $accent
    inner_color = rgba(1e1e2ecc)
    font_color = $text

    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Password</i></span>

    hide_input = false

    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    capslock_color = $yellow

    position = 0, -82
    halign = center
    valign = center
}

# =========================
# BOTTOM RIGHT: STATUS
# =========================

label {
    monitor =
    text = cmd[update:30000] bash -c 'cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 | awk "{print \"󰁹  \" \$1 \"%\"}"'
    color = $green
    font_size = 15
    font_family = $font

    position = -32, 30
    halign = right
    valign = bottom
}

