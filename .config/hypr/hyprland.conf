autogenerated = 0 # remove this line to remove the warning

################
### MONITORS ###
################

# monitor=<name>,<resolution>@<refreshrate>,<position>,<scale>
# monitor=,preferred,auto,auto
monitor=eDP-1,1920x1080@60,0x0,1.0
# monitor=HDMI-A-1,1920x1080@60,1920x0,1.0

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$floatingterminal = wezterm
$fileManager = dolphin
$menu = wofi --show drun
$scripts = $HOME/.scripts


#################
### AUTOSTART ###
#################

exec-once = /home/raviroy/02-Applications/pCloud.AppImage
exec-once = kdeconnectd & kdeconnect-indicator
exec-once = firefox
# exec-once = flatpak run app.zen_browser.zen
exec-once = waybar & mako & hypridle
exec-once = flatpak run com.ticktick.TickTick
exec-once = thunderbird
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1
exec-once = ~/.config/hypr/scripts/random_wallpaper.sh
exec-once = ~/.config/hypr/scripts/random_wallpaper.sh
exec-once = $scripts/check_battery2.py
exec-once = udiskie

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    # drop_shadow = true
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules =
    kb_options = caps:swapescape

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier
$altMod = ALT # Sets "ALT" key as second modifier

#  Keybinds to applications
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $SUPER_SHIFT, X, exit,
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $altMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = , PRINT, exec, hyprshot -m window
bind = SHIFT, PRINT, exec, hyprshot -m region
bind = $SUPER_SHIFT, l, exec, hyprlock
bind = $mainMod, P, exec, killall wlogout || wlogout
bind = $mainMod, C, exec, gnome-calculator
bind = $mainMod, grave, focusurgentorlast # the tilde button in left of number 1
bind = $mainMod, backspace, focusurgentorlast

# Binds with ALT key
bind = $altMod, return, exec, $floatingterminal
bind = $altMod, D, exec, $fileManager
bind = $altMod, tab, exec, /home/raviroy/.config/hypr/scripts/hidden_windows.sh --click

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces with altMod + [0-9]
bind = $altMod, 1, workspace, 11
bind = $altMod, 2, workspace, 12
bind = $altMod, 3, workspace, 13
bind = $altMod, 4, workspace, 14
bind = $altMod, 5, workspace, 15
bind = $altMod, 6, workspace, 16
bind = $altMod, 7, workspace, 17
bind = $altMod, 8, workspace, 18
bind = $altMod, 9, workspace, 19
bind = $altMod, 0, workspace, 20

# Extra keys for switching (WIN key)
bind = $mainMod, W, workspace, 10 #
bind = $mainMod, E, workspace, 1 # firefox
bind = $mainMod, A, workspace, 2 # terminal
bind = $mainMod, S, workspace, 3 # dolphin
bind = $mainMod, Z, workspace, 4 # Zotero

# Extra keys for switching (ALT key)
bind = $altMod, W, workspace, 20 #
bind = $altMod, E, workspace, 11 # mail(thunderbird)
bind = $altMod, A, workspace, 12 # second terminal
bind = $altMod, S, workspace, 13 # ticktick/calenda
bind = $altMod, Z, workspace, 14 # okular

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace with altMod + SHIFT + [0-9]
bind = $altMod SHIFT, 1, movetoworkspace, 11
bind = $altMod SHIFT, 2, movetoworkspace, 12
bind = $altMod SHIFT, 3, movetoworkspace, 13
bind = $altMod SHIFT, 4, movetoworkspace, 14
bind = $altMod SHIFT, 5, movetoworkspace, 15
bind = $altMod SHIFT, 6, movetoworkspace, 16
bind = $altMod SHIFT, 7, movetoworkspace, 17
bind = $altMod SHIFT, 8, movetoworkspace, 18
bind = $altMod SHIFT, 9, movetoworkspace, 19
bind = $altMod SHIFT, 0, movetoworkspace, 20

# Extra keys to move active window to a workspace with mainMod + SHIFT
bind = $mainMod SHIFT, E, movetoworkspace, 1 # firefox
bind = $mainMod SHIFT, A, movetoworkspace, 2 # terminal
bind = $mainMod SHIFT, S, movetoworkspace, 3 # dolphin
bind = $mainMod SHIFT, Z, movetoworkspace, 4 # Zotero

# Extra keys to move active window to a workspace with altMod + SHIFT
bind = $altMod SHIFT, E, movetoworkspace, 11 # mail(thunderbird)
bind = $altMod SHIFT, A, movetoworkspace, 12 # second terminal
bind = $altMod SHIFT, S, movetoworkspace, 13 # ticktick/calendar
bind = $altMod SHIFT, Z, movetoworkspace, 14 # okular

# Special workspace (scratchpad)
bind = $mainMod, M, togglespecialworkspace, general
bind = $mainMod SHIFT, M, movetoworkspace, special:general

bind = $mainMod, B, togglespecialworkspace, term
bind = $mainMod SHIFT, B, movetoworkspace, special:term

bind = $mainMod, N, togglespecialworkspace, notes
bind = $mainMod SHIFT, N, movetoworkspace, special:notes

bind= SUPER, F, fullscreen
bind = CTRL SHIFT, W , exec, ~/.config/hypr/scripts/restart-waybar.sh

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move using tab
bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1

# Shift workspaces left/right
bind = $mainMod SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, right, movecurrentworkspacetomonitor, r

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# Grouped window controls
# To add a window into a group, focus on the window and press mod and drag it
# to the desired group
bind = $mainMod, G, togglegroup
bind = CTRL, Tab, changegroupactive
bind = $mainMod SHIFT, G, moveoutofgroup  # remove the focused window from its group

group:groupbar:col.active = 0xfcf5c2e7   # Light lavender-pink (active)
group:groupbar:col.inactive = 0xfc585b70 # Muted dark purple-gray (inactive)
group:groupbar:height = 24
group:groupbar:font_size = 14
group:groupbar:rounding = 4

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
  name = windowrule-1
  float = on
  size = 1200 800
  match:class = ^(org\.wezfurlong\.wezterm)$
}


windowrule {
  name = windowrule-2
  float = on
  size = 600 400
  match:class = ^(org.gnome.Calendar)$
}


windowrule {
  name = windowrule-3
  float = on
  match:class = ^(eog)$
}


windowrule {
  name = windowrule-4
  float = on
  size = 400 600
  match:class = ^(xpad)$
}


windowrule {
  name = windowrule-5
  float = on
  size = 1200 800
  match:class = ^(featherpad)$
}


windowrule {
  name = windowrule-6
  float = on
  match:class = ^(org.gnome.Calculator)$
}


windowrule {
  name = windowrule-7
  float = on
  size = 400 400
  match:class = ^(org.kde.knotes)$
}


windowrule {
  name = windowrule-8
  float = on
  size = 1200 600
  match:class = ^(io.github.nokse22.minitext)$
}


# Needed for blur background in wlogout
layerrule {
  name = layerrule-1
  blur = on
  match:namespace = logout_dialog
}


# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-9
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-10
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Open apps in dedicated workspaces
windowrule {
  name = windowrule-11
  workspace = 1
  match:class = ^(org\.mozilla\.firefox)$
}

# windowrulev2 = workspace 1, class:^(app\.zen_browser\.zen)$
windowrule {
  name = windowrule-12
  workspace = 3
  match:class = ^(org\.kde\.dolphin)$
}

windowrule {
  name = windowrule-13
  workspace = 4
  match:class = ^(Zotero)$
}

windowrule {
  name = windowrule-14
  workspace = 11
  match:class = ^(net\.thunderbird\.Thunderbird)$
}

windowrule {
  name = windowrule-15
  workspace = 13
  match:class = ^(ticktick)$
}

windowrule {
  name = windowrule-16
  workspace = 14
  match:class = ^(org\.kde\.okular)$
}

